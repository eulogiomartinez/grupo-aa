<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo AA – Una luz en mi camino</title>

  <style>
   
   * {
  box-sizing: border-box;
}

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(rgba(11, 28, 45, 0.82), rgba(16, 42, 67, 0.85)),
                  url("fondo.jpeg") no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL (ESTILO TARJETA) */
    .contenedor {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* LOGO INTEGRADO */
    .logo-container {
      width: 130px;
      height: 130px;
      margin: 0 auto 20px auto;
      background: url("alcoholicos-anonimos-logo-png_seeklogo-6138.png") no-repeat center;
      background-size: contain;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
    }

    h1 {
      color: #4da3ff;
      font-size: 24px;
      margin: 0 0 25px 0;
      line-height: 1.3;
    }

    /* BOTONES */
    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 15px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .boton:active {
      transform: scale(0.98);
    }

    .horarios-btn { background: #1e90ff; }
    .maps { background: #4285F4; }
    .whatsapp { background: #25D366; }

    /* SECCIÓN HORARIOS */
    .horarios {
      display: none;
      margin: -5px 0 15px 0;
      background: rgba(255, 255, 255, 0.07);
      padding: 15px;
      border-radius: 12px;
      color: #00d4ff;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      animation: fadeIn 0.3s ease;
    }

    .horarios p {
      margin: 5px 0;
      font-size: 15px;
      color: #ffffff;
    }

    /* --- ASISTENTE DE IA FLOTANTE --- */
    #bot-burbuja {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #0076ff, #a855f7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), 0 4px 15px rgba(0,0,0,0.5);
      z-index: 100;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #bot-burbuja:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.7), 0 6px 20px rgba(0,0,0,0.6);
    }

    #bot-chat {
      display: none;
      position: fixed;
      bottom: 98px;
      right: 25px;
      width: 320px;
      max-height: 520px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.3);
      z-index: 100;
      animation: fadeIn 0.25s ease;
      color: #ffffff;
      backdrop-filter: blur(16px);
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-header .badge {
      background: linear-gradient(135deg, #0076ff, #a855f7);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .quick-btn {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .quick-btn:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.4);
      transform: translateX(3px);
    }

    #chat-box {
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .msg {
      font-size: 13px;
      line-height: 1.4;
      padding: 8px 12px;
      border-radius: 10px;
      word-break: break-word;
    }

    .msg-user {
      background: #0076ff;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .msg-bot {
      background: rgba(255, 255, 255, 0.08);
      color: #00d4ff;
      border: 1px solid rgba(0, 212, 255, 0.2);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .input-container {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-container input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 10px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .input-container input:focus {
      border-color: #a855f7;
    }

    .input-container button {
      background: #a855f7;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 768px) {
      .contenedor {
        max-width: 500px;
        padding: 40px 30px;
        background: rgba(16, 42, 67, 0.6);
      }
      h1 { font-size: 28px; }
      .boton:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
      }
      #bot-chat { width: 340px; }
    }

/* Modifica la animación dentro de #bot-burbuja::after */
#bot-burbuja::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -150%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    60deg,
    transparent 30%,
    rgba(255, 255, 255, 0.25) 50%, /* Bajamos la opacidad para que sea más tenue */
    transparent 70%
  );
  transform: rotate(25deg);
  animation: shimmerEfecto 6s infinite ease-in-out; /* Ciclo más largo de 6 segundos */
}

/* Nuevos porcentajes para que el destello tarde más en cruzar */
@keyframes shimmerEfecto {
  0% {
    left: -150%;
  }
  40% {
    left: 150%; /* Tarda casi 2.5 segundos en cruzar suavemente */
  }
  100% {
    left: 150%; /* Se queda en pausa los 3.5 segundos restantes */
  }
}

  </style>
</head>

<body>

<div class="contenedor">
  <div class="logo-container"></div>

  <h1>Grupo de AA<br>Una luz en mi camino</h1>

  <button class="boton horarios-btn" onclick="toggleHorarios()">🕒 Ver horarios</button>

  <div class="horarios">
    <p><strong>Horarios del grupo</strong></p>
    <p>Lunes a Sábado: 8:00 PM – 9:30 PM</p>
    <p>Domingo: Cerrado</p>
  </div>

  <a class="boton maps" href="https://maps.app.goo.gl/CkVj6bCxg8EmCzt8A" target="_blank">
    📍 Ver ubicación
  </a>

  <a class="boton whatsapp" href="https://wa.me/5218117285695" target="_blank">
    💬 Hablar por WhatsApp
  </a>
</div>

<!-- Burbuja del Bot -->
<div id="bot-burbuja">🤖</div>

<!-- Ventana del Bot -->
<div id="bot-chat">
  <div class="chat-header">
    <span style="font-size: 20px;">🤖</span>
    <div>
      <strong style="font-size: 15px; color: white;">Asistente Virtual</strong>
      <div style="margin-top: 2px;"><span class="badge">IA ONLINE</span></div>
    </div>
  </div>

  <p style="margin: 0 0 8px 0; font-size: 13px; color: #cbd5e1;">Hola, selecciona una opción o escribe tu duda:</p>

  <!-- Botones de Opciones Rápidas -->
  <button class="quick-btn" onclick="enviarOpcion('¿Cuáles son los requisitos para asistir?')">📋 Requisitos <span>›</span></button>
  <button class="quick-btn" onclick="enviarOpcion('¿Tiene algún costo ingresar al grupo?')">💲 Costos <span>›</span></button>
  <button class="quick-btn" onclick="enviarOpcion('¿Qué es el grupo Una luz en mi camino y cómo ayudan?')">👥 Sobre Nosotros <span>›</span></button>
  <button class="quick-btn" onclick="enviarOpcion('¿Es un anexo o cómo funcionan sus reuniones?')">❓ Dudas Comunes <span>›</span></button>

  <!-- Historial de Conversación -->
  <div id="chat-box"></div>

  <!-- Campo de Texto para Entradas Libres -->
  <div class="input-container">
    <input type="text" id="user-input" placeholder="Escribe un mensaje..." onkeydown="detectarEnter(event)">
    <button id="send-btn" onclick="enviarMensaje()">Enviar</button>
  </div>
</div>

<script>
  function toggleHorarios() {
    const h = document.querySelector(".horarios");
    if (h) h.style.display = h.style.display === "block" ? "none" : "block";
  }

  const burbuja = document.getElementById("bot-burbuja");
  const chat = document.getElementById("bot-chat");

  if (burbuja && chat) {
    burbuja.onclick = () => {
      if (chat.style.display === "flex") {
        chat.style.display = "none";
        burbuja.innerHTML = "🤖";
      } else {
        chat.style.display = "flex";
        burbuja.innerHTML = "❌";
      }
    };
  }

  function detectarEnter(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      enviarMensaje();
    }
  }

  function enviarOpcion(texto) {
    document.getElementById("user-input").value = texto;
    enviarMensaje();
  }

  async function enviarMensaje() {
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const chatBox = document.getElementById("chat-box");
    const mensaje = input.value.trim();

    if (!mensaje) return;

    // Renderizar mensaje del usuario
    agregarMensaje(mensaje, "msg-user");
    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    // Mensaje temporal de carga
    const botMsgTemp = agregarMensaje("Pensando...", "msg-bot");

    // Construir el prompt con las reglas del grupo de AA
    const promptConInstrucciones = `Eres el asistente virtual oficial del grupo de Alcohólicos Anónimos (AA) 'Una luz en mi camino'.

REGLAS STRICTAS:
1. ROL Y TONO: Responde siempre de forma breve, cálida, empática, respetuosa y anónima.
2. DELIMITACIÓN DE TEMA: Solo responderás dudas relacionadas con Alcohólicos Anónimos, el problema del alcoholismo, el grupo 'Una luz en mi camino'.
3. TEMAS AJENOS: Si el usuario realiza preguntas sobre otros temas, declina amablemente.

INFORMACIÓN DEL GRUPO:
- Horarios: Lunes a Sábado de 8:00 PM a 9:30 PM. Domingos cerrado.
- Requisitos: El único requisito para ser miembro de AA es el deseo de dejar de beber. No hay requisitos de edad ni registros.
- Costos: Todos los servicios y reuniones son totalmente gratuitos. No hay cuotas ni cobros, nos sostenemos con contribuciones voluntarias.
- Anexo/Encierro: Aclara que NO es un anexo ni clínica de rehabilitación. La persona entra y sale por su propia voluntad al terminar la sesión de hora y media.

Pregunta del usuario: ${mensaje}`;

    try {
      // Petición segura apuntando únicamente a tu Worker de Cloudflare
      const response = await fetch(
        "https://grupo-aa-bot.eulogiomartinez096.workers.dev",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptConInstrucciones }),
        }
      );

      const data = await response.json();

      if (
        response.ok &&
        data.candidates &&
        data.candidates[0]?.content?.parts[0]?.text
      ) {
        let respuestaTexto = data.candidates[0].content.parts[0].text;
        botMsgTemp.textContent = respuestaTexto.replaceAll("**", "");
      } else {
        botMsgTemp.textContent =
          data.error?.message ||
          "Ocurrió un error al consultar la información.";
      }
    } catch (error) {
      botMsgTemp.textContent = "Error de conexión con la red.";
      console.error(error);
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  }

  function agregarMensaje(texto, clase) {
    const chatBox = document.getElementById("chat-box");
    const div = document.createElement("div");
    div.className = `msg ${clase}`;
    div.textContent = texto;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }
</script>

</body>
</html>
